<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Brittany Lyons Interiors | Mockup review</title>
  <style>
    :root {
      --paper: #f4f1eb;
      --ink: #173743;
      --muted: #5a686b;
      --line: rgba(23, 55, 67, 0.2);
      --white: #fff;
      --gold: #c1a948;
      --gold-ink: #78613e;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 55, 67, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 55, 67, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: clamp(56px, 8vw, 112px) 0 72px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 32px;
      margin-bottom: clamp(32px, 5vw, 64px);
      padding-bottom: 24px;
      border-bottom: 1px solid var(--ink);
    }

    h1 {
      max-width: 800px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 7vw, 6.8rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .client {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .instruction {
      max-width: 260px;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(20px, 3vw, 38px);
    }

    .option {
      display: grid;
      color: inherit;
      background: var(--white);
      border: 1px solid var(--line);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .option:hover {
      transform: translateY(-4px);
      border-color: var(--ink);
    }

    .option--gold {
      border-color: rgba(193, 169, 72, 0.7);
    }

    .option--gold .version { color: var(--gold-ink); }
    .option--gold .arrow { border-color: var(--gold); }

    .option:focus-visible {
      outline: 3px solid #397b91;
      outline-offset: 4px;
    }

    .preview {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #dce3e4;
      border-bottom: 1px solid var(--line);
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms ease;
    }

    .option:hover img { transform: scale(1.025); }

    .option-copy {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      min-height: 112px;
      padding: 22px 24px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 2.6vw, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .version {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .arrow {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font-size: 1.3rem;
    }

    @media (max-width: 960px) {
      .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 28px, 560px);
        padding-top: 36px;
      }

      header {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .instruction { max-width: none; }
      .options { grid-template-columns: 1fr; }
      .option-copy { min-height: 96px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .option,
      .preview img { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="client">Brittany Lyons Interiors</p>
        <h1>Choose a mockup</h1>
      </div>
      <p class="instruction">Select a version to open the full website.</p>
    </header>

    <section class="options" aria-label="Website mockups">
      <a class="option" href="classic/index.html">
        <div class="preview">
          <img src="classic/hero-faux-oner-poster.jpg" alt="Preview of the Seaglass website concept"/>
        </div>
        <div class="option-copy">
          <h2><span class="version">Concept 01</span>Seaglass</h2>
          <span class="arrow" aria-hidden="true">&#8594;</span>
        </div>
      </a>

      <a class="option" href="r2/index.html">
        <div class="preview">
          <img src="r2-preview.jpeg" alt="Preview of the Still Water website concept"/>
        </div>
        <div class="option-copy">
          <h2><span class="version">Concept 02</span>Still Water</h2>
          <span class="arrow" aria-hidden="true">&#8594;</span>
        </div>
      </a>

      <a class="option option--gold" href="r2-gold/index.html">
        <div class="preview">
          <img src="r2-gold-preview.jpeg" alt="Preview of the Gilded Light website concept"/>
        </div>
        <div class="option-copy">
          <h2><span class="version">Concept 03</span>Gilded Light</h2>
          <span class="arrow" aria-hidden="true">&#8594;</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
